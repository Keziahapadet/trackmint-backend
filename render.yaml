services:
  - type: web
    name: trackmint-backend
    env: docker
    plan: free
    buildCommand: ./mvnw -DskipTests clean package
    startCommand: java -jar target/app-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_PROFILES_ACTIVE
        value: production